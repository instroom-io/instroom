client_id = "64eae60dea37c2eaec925e771f180eab"
application_url = "https://instroom.io/shopify-embedded"
embedded = true
name = "Instroom"

[access_scopes]
scopes = "read_discounts,write_draft_orders,read_draft_orders,read_orders,write_orders,read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://instroom.io/shopify-embedded" ]

[webhooks]
api_version = "2026-07"

# Also covers stores that never linked.
[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "https://instroom.io/api/webhooks/shopify/app-uninstalled"

# Order webhooks are added per store on link.
[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request" ]
uri = "https://instroom.io/api/webhooks/shopify/gdpr/customers-data-request"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/redact" ]
uri = "https://instroom.io/api/webhooks/shopify/gdpr/customers-redact"

[[webhooks.subscriptions]]
compliance_topics = [ "shop/redact" ]
uri = "https://instroom.io/api/webhooks/shopify/gdpr/shop-redact"
